<style>
    :root {
        --app-bg: #07111f;
        --app-surface: rgba(16, 30, 50, 0.9);
        --app-surface-strong: #13243c;
        --app-border: rgba(148, 163, 184, 0.2);
        --app-border-strong: rgba(96, 165, 250, 0.55);
        --app-text: #eff6ff;
        --app-muted: #9fb1c8;
        --app-accent: #60a5fa;
        --app-accent-strong: #22d3ee;
        --app-canvas: #f8fafc;
        --app-canvas-border: #cbd5e1;
        --app-shadow: 0 24px 70px rgba(2, 8, 23, 0.42);
    }

    :root[data-theme="light"] {
        --app-bg: #eef4fb;
        --app-surface: rgba(255, 255, 255, 0.94);
        --app-surface-strong: #ffffff;
        --app-border: rgba(15, 23, 42, 0.14);
        --app-border-strong: rgba(37, 99, 235, 0.45);
        --app-text: #10213a;
        --app-muted: #5e708b;
        --app-accent: #2563eb;
        --app-accent-strong: #0891b2;
        --app-shadow: 0 24px 70px rgba(15, 23, 42, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
        margin: 0;
        color: var(--app-text);
        background:
            radial-gradient(circle at 8% -10%, rgba(34, 211, 238, 0.14), transparent 32rem),
            radial-gradient(circle at 92% 0%, rgba(129, 140, 248, 0.16), transparent 34rem),
            var(--app-bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: color 160ms ease, background 160ms ease;
    }

    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--app-accent-strong); outline-offset: 3px; }

    #inspectorDiv { min-height: 100vh; padding: 14px; }
    .quirk-toolbar {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 12px 16px;
        border: 1px solid var(--app-border);
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(17, 31, 52, 0.96), rgba(10, 21, 38, 0.9));
        box-shadow: 0 12px 30px rgba(2, 8, 23, 0.2);
        backdrop-filter: blur(18px);
    }
    [data-theme="light"] .quirk-toolbar { background: rgba(255, 255, 255, 0.9); }
    .toolbar-brand { display: flex; align-items: center; gap: 10px; min-width: 190px; }
    .brand-mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        color: #04111e;
        background: linear-gradient(135deg, #67e8f9, #818cf8);
        font-weight: 900;
        box-shadow: 0 0 24px rgba(96, 165, 250, 0.42);
    }
    .toolbar-brand strong { display: block; font-size: 15px; letter-spacing: 0.01em; }
    .toolbar-brand span { display: block; color: var(--app-muted); font-size: 11px; margin-top: 2px; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-button {
        min-height: 36px;
        padding: 8px 13px;
        border: 1px solid var(--app-border);
        border-radius: 10px;
        color: var(--app-text);
        background: rgba(148, 163, 184, 0.08);
        cursor: pointer;
        transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .toolbar-button:hover { transform: translateY(-1px); border-color: var(--app-border-strong); background: rgba(96, 165, 250, 0.15); }
    .toolbar-button-accent { border-color: rgba(34, 211, 238, 0.48); background: rgba(34, 211, 238, 0.14); }
    .toolbar-button-danger { color: #fecaca; }
    [data-theme="light"] .toolbar-button-danger { color: #b91c1c; }
    .app-meta { margin-left: auto; color: var(--app-muted); font-size: 12px; white-space: nowrap; }
    #canvasDiv {
        width: 100%;
        min-height: calc(100vh - 98px);
        margin-top: 14px;
        overflow: auto;
        touch-action: manipulation;
        tab-index: 0;
        position: relative;
        border: 1px solid var(--app-canvas-border);
        border-radius: 16px;
        background: var(--app-canvas);
        box-shadow: var(--app-shadow);
    }
    #drawCanvas { display: block; }

    #menu-div { position: fixed; inset: 0; z-index: 1000; overflow: auto; padding: clamp(18px, 4vw, 56px); }
    #menu-overlay { position: absolute; inset: 0; background: rgba(2, 8, 23, 0.78); backdrop-filter: blur(14px); }
    .menu-shell { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.7fr); gap: 14px; max-width: 1120px; margin: auto; }
    .menu-card, .menu-examples {
        border: 1px solid var(--app-border);
        border-radius: 22px;
        background: linear-gradient(145deg, rgba(17, 32, 54, 0.97), rgba(8, 19, 35, 0.96));
        box-shadow: var(--app-shadow);
    }
    [data-theme="light"] .menu-card, [data-theme="light"] .menu-examples { background: rgba(255, 255, 255, 0.97); }
    .menu-card { padding: clamp(24px, 4vw, 44px); text-align: left; }
    .menu-brand { display: flex; align-items: center; gap: 12px; }
    .menu-brand svg { width: 42px; height: 42px; }
    .menu-brand h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.04em; }
    .menu-kicker { margin: 12px 0 0; color: var(--app-muted); font-size: 16px; line-height: 1.6; }
    .menu-loading { min-height: 62px; display: grid; place-items: center; color: #fbbf24; font-size: 20px; }
    .menu-primary { width: 100%; min-height: 58px; border: 1px solid var(--app-border-strong); border-radius: 13px; color: #ecfeff; background: linear-gradient(135deg, #0e7490, #4f46e5); font-weight: 700; cursor: pointer; box-shadow: 0 10px 26px rgba(34, 211, 238, 0.18); }
    .menu-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .menu-section-label { margin: 24px 0 10px; color: var(--app-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .menu-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .menu-link-tile { display: grid; gap: 6px; place-items: center; min-height: 104px; padding: 12px 8px; border: 1px solid var(--app-border); border-radius: 14px; color: var(--app-text); text-decoration: none; background: rgba(148, 163, 184, 0.06); transition: border-color 140ms ease, transform 140ms ease, background 140ms ease; }
    .menu-link-tile:hover { transform: translateY(-2px); border-color: var(--app-border-strong); background: rgba(96, 165, 250, 0.13); }
    .menu-link-tile svg { width: 34px; height: 34px; opacity: 0.86; }
    .menu-examples { padding: 24px; }
    .menu-examples h2 { margin: 0 0 16px; font-size: 18px; }
    .example-list { display: grid; gap: 8px; }
    .example-list a { display: block; padding: 11px 13px; border: 1px solid transparent; border-radius: 11px; color: var(--app-muted); text-decoration: none; line-height: 1.3; cursor: pointer; }
    .example-list a:hover { color: var(--app-text); border-color: var(--app-border); background: rgba(96, 165, 250, 0.1); }
    .menu-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--app-border); }
    .menu-footer span { color: var(--app-muted); font-size: 12px; }
    #theme-toggle { min-height: 36px; padding: 8px 12px; border: 1px solid var(--app-border); border-radius: 10px; color: var(--app-text); background: rgba(148, 163, 184, 0.08); cursor: pointer; }
    #theme-toggle:hover { border-color: var(--app-border-strong); background: rgba(96, 165, 250, 0.15); }

    @media (max-width: 760px) {
        #inspectorDiv { padding: 9px; }
        .quirk-toolbar { gap: 10px; border-radius: 14px; }
        .toolbar-brand { min-width: 0; flex: 1 0 100%; }
        .toolbar-actions { width: 100%; }
        .toolbar-button { flex: 1 1 auto; padding-inline: 10px; }
        .app-meta { margin-left: 0; }
        #canvasDiv { min-height: calc(100vh - 156px); margin-top: 9px; border-radius: 12px; }
        #menu-div { padding: 12px; }
        .menu-shell { grid-template-columns: 1fr; }
        .menu-card { padding: 22px; }
        .menu-examples { padding: 20px; }
        .menu-links { grid-template-columns: 1fr; }
        .menu-link-tile { min-height: 62px; grid-template-columns: 34px 1fr; justify-items: start; text-align: left; }
    }
</style>
